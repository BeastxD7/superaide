# Labels for issues and pull requests. This file is the source of truth:
# .github/workflows/labels.yml applies it on every push to main that changes it,
# and deletes labels that aren't listed here.
#
# Families:
#   type:*      what kind of work it is (one per issue)
#   area:*      which part of the product (one or more)
#   priority:*  how soon (set during triage)
#   status:*    where it is in triage
# Plus: security, good first issue, help wanted, accessibility, dependencies.
#
# `from_name` renames an existing label in place, so issues keep it.

# --- type -------------------------------------------------------------------
- name: "type:bug"
  from_name: "bug"
  color: "d73a4a"
  description: "Something doesn't work the way it should"
- name: "type:feature"
  from_name: "enhancement"
  color: "1d76db"
  description: "New behaviour or an improvement to existing behaviour"
- name: "type:capability"
  color: "5319e7"
  description: "A new or changed Capability (skill, ADR 0006)"
- name: "type:regression"
  color: "b60205"
  description: "Worked before, or an eval score dropped"
- name: "type:docs"
  from_name: "documentation"
  color: "0075ca"
  description: "README, guides, ADRs or code comments"
- name: "type:question"
  from_name: "question"
  color: "d876e3"
  description: "Needs an answer rather than a code change"
- name: "type:chore"
  color: "c5def5"
  description: "Maintenance: refactors, tooling, CI, housekeeping"

# --- area -------------------------------------------------------------------
# Same names as the "Area" dropdown in the issue forms.
- name: "area:backend"
  from_name: "python:uv"
  color: "0e8a16"
  description: "FastAPI, pipeline, database, migrations"
- name: "area:frontend"
  from_name: "javascript"
  color: "0e8a16"
  description: "Next.js app, dashboard, console"
- name: "area:channels"
  color: "0e8a16"
  description: "Telegram, Slack and web chat"
- name: "area:memory"
  color: "0e8a16"
  description: "Memory, recall, citations, the audience gate"
- name: "area:reminders"
  color: "0e8a16"
  description: "Reminders, jobs, digests"
- name: "area:triage"
  color: "0e8a16"
  description: "Triage and escalation (ADR 0010)"
- name: "area:providers"
  color: "0e8a16"
  description: "AI model providers and prompts (ADR 0007)"
- name: "area:capabilities"
  color: "0e8a16"
  description: "Skills, connectors and the manifest (ADR 0006)"
- name: "area:spend"
  color: "0e8a16"
  description: "Billing, the spend cap, the ledger"
- name: "area:auth"
  color: "0e8a16"
  description: "Accounts, sessions, identity, tenancy"
- name: "area:deploy"
  from_name: "docker"
  color: "0e8a16"
  description: "Docker, Caddy, the VPS, start.command"
- name: "area:ci"
  from_name: "github_actions"
  color: "0e8a16"
  description: "CI, end-to-end tests, evals, repo tooling"

# --- priority ---------------------------------------------------------------
- name: "priority:p0"
  color: "b60205"
  description: "Critical: data leak, outage or spend runaway. Drop everything"
- name: "priority:p1"
  color: "d93f0b"
  description: "High: a core flow is broken. Fix this week"
- name: "priority:p2"
  color: "fbca04"
  description: "Medium: real problem with a workaround"
- name: "priority:p3"
  color: "fef2c0"
  description: "Low: polish, when there's time"

# --- status -----------------------------------------------------------------
- name: "status:triage"
  color: "ededed"
  description: "New; not reviewed yet"
- name: "status:needs-info"
  color: "ededed"
  description: "Waiting for details from the reporter"
- name: "status:accepted"
  color: "c2e0c6"
  description: "Reviewed and planned"
- name: "status:blocked"
  color: "e99695"
  description: "Waiting on something else"
- name: "status:duplicate"
  from_name: "duplicate"
  color: "cfd3d7"
  description: "Already tracked elsewhere"
- name: "status:invalid"
  from_name: "invalid"
  color: "cfd3d7"
  description: "Not a problem, or can't be reproduced"
- name: "status:wontfix"
  from_name: "wontfix"
  color: "ffffff"
  description: "Won't be worked on"

# --- other ------------------------------------------------------------------
- name: "security"
  color: "b60205"
  description: "Security hardening. Report vulnerabilities privately (SECURITY.md)"
- name: "privacy"
  color: "b60205"
  description: "What Ava may reveal, store or forget"
- name: "accessibility"
  color: "f143ab"
  description: "Barrier affecting people with disabilities"
- name: "good first issue"
  color: "7057ff"
  description: "Small and well defined; good for newcomers"
- name: "help wanted"
  color: "008672"
  description: "Extra attention is needed"
- name: "dependencies"
  color: "0366d6"
  description: "Dependency updates (Dependabot)"
- name: "full-suite"
  color: "b60205"
  description: "Run every test, not only those of the modules the pull request changes (re-run the Changed paths job after adding it)"
- name: "tests-not-needed"
  color: "ededed"
  description: "Maintainer exemption: a feat or fix with no test file, reason in the PR body (re-run the Tests required job)"
