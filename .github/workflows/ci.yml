name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A GitHub merge queue (if enabled) tests the merged result once, here.
  merge_group:
  workflow_dispatch:
  # The scheduled full run (full.yml) calls this same pipeline.
  workflow_call:

permissions:
  contents: read

# A newer push cancels the run before it. When full.yml calls this, github.workflow is the
# caller's name, so its runs land in their own group and are never cancelled.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.workflow == 'CI' }}

jobs:
  # Decides which jobs a pull request needs (docs/0013). Pushes to main, merge groups, manual
  # runs and the scheduled Full run ignore the filters and run everything.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the filter lists the PR's files through the API
    outputs:
      backend: ${{ steps.out.outputs.backend }}
      frontend: ${{ steps.out.outputs.frontend }}
      e2e: ${{ steps.out.outputs.e2e }}
      docker: ${{ steps.out.outputs.docker }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          filters: |
            backend_all:
              - 'backend/**'
            frontend_all:
              - 'frontend/**'
            e2e:
              - 'e2e/**'
            docker:
              - '**/Dockerfile'
              - '**/.dockerignore'
              - 'deploy/**'
              - 'compose.yaml'
              - 'docker-compose.prod.yml'
              - '.env.prod.example'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
            # Everything that is not documentation. A file here that no filter above owns
            # (Makefile, scripts, workflows, root config) makes the whole pipeline run.
            code:
              - '**'
              - '!**/*.md'
              - '!docs/**'
              - '!LICENSE*'
              - '!assets/**'
              - '!.github/ISSUE_TEMPLATE/**'
              - '!.github/CODEOWNERS'
              - '!.github/pull_request_template.md'
            pipeline:
              - '.github/workflows/**'
              - 'scripts/**'
              - 'Makefile'
              - 'compose.yaml'
              - '.gitleaks.toml'

      - name: Resolve what to run
        id: out
        env:
          EVENT: ${{ github.event_name }}
          F: ${{ toJSON(steps.filter.outputs) }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "Event $EVENT: running everything."
            all=true
          else
            has() { [ "$(echo "$F" | jq -r --arg k "$1" '.[$k] // "false"')" = "true" ]; }
            all=false
            # Fail closed: a code file no specific filter owns, or a pipeline file, runs everything.
            if has pipeline; then all=true; fi
            if has code && ! has backend_all && ! has frontend_all && ! has e2e && ! has docker; then all=true; fi
          fi
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          if [ "$all" = true ]; then
            for k in backend frontend e2e docker; do out $k true; done
          else
            b=false; fe=false; e=false; d=false
            if has backend_all; then b=true; fi
            if has frontend_all; then fe=true; fi
            # e2e drives both halves, so a change to either one (or to e2e itself) runs it.
            if has e2e || [ $b = true ] || [ $fe = true ]; then e=true; fi
            if has docker; then d=true; fi
            out backend $b; out frontend $fe; out e2e $e; out docker $d
          fi

  backend:
    name: Backend (lint, types, migrations, tests)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://agent:agent@localhost:5432/agent
      TEST_DATABASE_URL: postgresql+psycopg://agent:agent@localhost:5432/agent_test
      PGPASSWORD: agent
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked

      # Two migrations with the same parent (say, two 0022s from parallel branches) leave
      # several heads and break `alembic upgrade head`; catch it before the slower steps.
      - name: One migration head
        run: |
          uv run alembic heads
          test "$(uv run alembic heads | wc -l)" -eq 1 || { echo "::error::alembic has more than one head; renumber or merge the new migration"; exit 1; }

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Migrations apply, match the models, and roll back
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

      - name: Tests
        run: |
          psql -h localhost -U agent -d agent -c "CREATE DATABASE agent_test"
          uv run pytest --cov --cov-report=term-missing:skip-covered

  frontend:
    name: Frontend (lint, types, build)
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit tests
        run: npm test
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  e2e:
    name: End-to-end (shard ${{ matrix.shard }}/3)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    needs: [changes, backend, frontend]
    # backend and frontend may be skipped (nothing in them changed); a failure still blocks.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.e2e == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_PG_ADMIN_URL: postgresql://agent:agent@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Install
        run: |
          (cd backend && uv python install && uv sync --locked --no-dev)
          (cd frontend && npm ci --no-audit --no-fund && npm run build)
          (cd e2e && npm ci --no-audit --no-fund && npx playwright install --with-deps chromium)

      - name: Run end-to-end tests
        working-directory: e2e
        run: npx playwright test --shard=${{ matrix.shard }}/3

      - name: Run the API proxy contract tests
        if: matrix.shard == 1
        working-directory: e2e
        run: E2E_PROXY=1 npx playwright test --project=proxy

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [changes, backend, frontend]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.docker == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Production compose file is valid
        run: |
          cp .env.prod.example .env
          docker compose -f docker-compose.prod.yml config -q
        env:
          # The example leaves secrets blank on purpose; any value satisfies the required-variable checks.
          POSTGRES_PASSWORD: ci
          SECRETS_MASTER_KEY: ci
          ADMIN_TOKEN: ci

      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: superaide-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          tags: superaide-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build the Caddy image (HTTPS proxy with rate limiting)
        uses: docker/build-push-action@v7
        with:
          context: deploy/caddy
          push: false
          load: true
          tags: superaide-caddy:ci
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

      - name: Caddyfile is valid
        run: docker run --rm -e DOMAIN=example.com superaide-caddy:ci caddy validate --config /etc/caddy/Caddyfile

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # on a pull request, gitleaks-action lists its commits
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .gitleaks.toml uses [[allowlists]] tables, which need gitleaks 8.25 or later
          # (the action's default, 8.24.3, ignores them).
          GITLEAKS_VERSION: 8.28.0

  # The one check to require in branch protection. Skipped jobs count as success, a failed or
  # cancelled one (or an unexpected state) fails it. Without this, a required job that was
  # skipped would stay pending forever.
  result:
    name: CI result
    if: always()
    needs: [changes, backend, frontend, e2e, images, secrets]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # changes and the secret scan are never skipped.
          for j in changes secrets; do
            [ "$(echo "$NEEDS" | jq -r --arg j "$j" '.[$j].result')" = success ] || { echo "::error::$j did not succeed"; exit 1; }
          done
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          [ -z "$bad" ] || { echo "::error::failed, cancelled or unknown: $bad"; exit 1; }
          # A job skipped although its filter asked for it ran into an upstream problem: fail.
          for j in backend frontend e2e; do
            want=$(echo "$NEEDS" | jq -r --arg j "$j" '.changes.outputs[$j]')
            got=$(echo "$NEEDS" | jq -r --arg j "$j" '.[$j].result')
            [ "$want" != true ] || [ "$got" = success ] || { echo "::error::$j was required but is $got"; exit 1; }
          done
          want=$(echo "$NEEDS" | jq -r '.changes.outputs.docker')
          [ "$want" != true ] || [ "$(echo "$NEEDS" | jq -r '.images.result')" = success ] || { echo "::error::images was required but did not succeed"; exit 1; }
