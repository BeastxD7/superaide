name: CI

on:
  push:
    branches: [main]
  pull_request:
  # A GitHub merge queue (if enabled) tests the merged result once, here.
  merge_group:
  workflow_dispatch:
  # The scheduled full run (full.yml) calls this same pipeline.
  workflow_call:

permissions:
  contents: read

# A newer push to a pull request cancels the run before it. Runs on main are never cancelled
# (each push gets its verdict), and when full.yml calls this, github.workflow is the caller's
# name, so its runs land in their own group and are never cancelled either.
concurrency:
  # On main every push has its own group: GitHub keeps only ONE queued run per group and cancels older queued
  # ones, so merging several PRs in a row left main with cancelled runs and no verdict.
  group: ci-${{ github.workflow }}-${{ github.ref }}${{ github.ref == 'refs/heads/main' && format('-{0}', github.sha) || '' }}
  cancel-in-progress: ${{ github.workflow == 'CI' && github.ref != 'refs/heads/main' }}

jobs:
  # Decides which jobs a pull request needs (docs/0013). Pushes to main, merge groups, manual
  # runs and the scheduled Full run ignore the filters and run everything.
  changes:
    name: Changed paths
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # the filter lists the PR's files through the API
    outputs:
      backend: ${{ steps.out.outputs.backend }}
      frontend: ${{ steps.out.outputs.frontend }}
      e2e: ${{ steps.out.outputs.e2e }}
      e2e_smoke: ${{ steps.out.outputs.e2e_smoke }}
      docker: ${{ steps.out.outputs.docker }}
      # Test selection (docs/design/test-modules.md): which backend test files, e2e specs and unit tests a pull request
      # needs. "full" on main, in Full, manually, with the full-suite label, for shared files and when the selector fails.
      selection_mode: ${{ steps.out.outputs.selection_mode }}
      backend_tests: ${{ steps.out.outputs.backend_tests }}
      backend_files: ${{ steps.out.outputs.backend_files }}
      e2e_only: ${{ steps.out.outputs.e2e_only }}
      vitest_files: ${{ steps.out.outputs.vitest_files }}
    steps:
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        if: github.event_name == 'pull_request'
        with:
          list-files: json
          filters: |
            backend_all:
              - 'backend/**'
            frontend_all:
              - 'frontend/**'
            e2e:
              - 'e2e/**'
            contract:
              - 'backend/openapi.snapshot.json'
            docker:
              - '**/Dockerfile'
              - '**/.dockerignore'
              - 'deploy/**'
              - 'compose.yaml'
              - 'docker-compose.prod.yml'
              - '.env.prod.example'
              - 'backend/pyproject.toml'
              - 'backend/uv.lock'
              - 'frontend/package.json'
              - 'frontend/package-lock.json'
            files:
              - '**'
            pipeline:
              - '.github/workflows/**'
              - '.github/actions/**'
              - 'scripts/**'
              - 'Makefile'
              - 'compose.yaml'
              - '.gitleaks.toml'

      # Which tests does this change need? scripts/select_tests.py reads ci/modules.toml and the import graph of the
      # backend. The checkout is the PR merged into its base (depth 2: HEAD^1 is the base), so `HEAD^1...HEAD` is
      # exactly the PR's change, renames and deletions included. Anything that goes wrong selects the full suite.
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
          persist-credentials: false

      - uses: astral-sh/setup-uv@v7
        if: github.event_name == 'pull_request'
        with:
          version: "0.11.32"

      - name: Select the tests
        id: select
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set +e
          # Read live (like tests-required), so adding the label and re-running this job is enough.
          labels=$(gh api "repos/$REPO/pulls/$PR" --jq '[.labels[].name] | join(",")')
          if [ $? -ne 0 ]; then force="could not read the pull request labels"; fi
          case ",$labels," in *,full-suite,*) force="label full-suite" ;; esac
          if [ -n "${force:-}" ]; then args=(--force-full "$force"); else args=(--base HEAD^1 --head HEAD); fi
          uv run --python 3.14 --no-project python scripts/select_tests.py "${args[@]}" --format github --summary-file "$GITHUB_STEP_SUMMARY" > select.out
          if [ $? -ne 0 ] || ! grep -q '^selection=' select.out; then
            echo "::warning::the test selector failed; running the full suite"
            echo "Test selection failed, so the full suite runs." >> "$GITHUB_STEP_SUMMARY"
            printf '%s\n' 'mode=full' 'backend_run=true' 'selection={"mode":"full","reasons":["selector failed"],"modules":[],"changed_modules":[],"backend":{"mode":"all","run":true,"files":[]},"e2e":{"mode":"all","specs":[]},"vitest":{"mode":"all","files":[]},"counts":{}}' > select.out
          fi
          cat select.out >> "$GITHUB_OUTPUT"

      - name: Resolve what to run
        id: out
        env:
          EVENT: ${{ github.event_name }}
          F: ${{ toJSON(steps.filter.outputs) }}
          FILES: ${{ steps.filter.outputs.files_files }}
          SEL: ${{ steps.select.outputs.selection }}
        run: |
          set -euo pipefail
          if [ "$EVENT" != "pull_request" ]; then
            echo "Event $EVENT: running everything."
            all=true
          else
            has() { [ "$(echo "$F" | jq -r --arg k "$1" '.[$k] // "false"')" = "true" ]; }
            all=false
            # Fail closed: a code file no specific filter owns, or a pipeline file, runs everything.
            if has pipeline; then all=true; fi
            # Code is every changed file that is not documentation (md files, docs/, license, assets,
            # issue templates, CODEOWNERS, the PR template).
            code=$(echo "$FILES" | jq -r '.[]' | grep -vE '\.md$|^docs/|^LICENSE|^assets/|^\.github/ISSUE_TEMPLATE/|^\.github/(CODEOWNERS|pull_request_template\.md)$' || true)
            echo "Changed files:"; echo "$FILES" | jq -r '.[]'
            if [ -n "$code" ] && ! has backend_all && ! has frontend_all && ! has e2e && ! has docker; then all=true; fi
          fi
          out() { echo "$1=$2" >> "$GITHUB_OUTPUT"; echo "$1=$2"; }
          # The selection narrows only what runs inside the jobs below; whether a job runs at all is still decided
          # by the filters above. Without a usable selection (main, merge group, manual, Full, or "everything" for
          # any other reason) every test runs.
          sel_mode=full
          if [ "$all" != true ] && [ -n "${SEL:-}" ]; then sel_mode=$(echo "$SEL" | jq -r '.mode'); fi
          out selection_mode "$sel_mode"
          if [ "$sel_mode" = selected ] || [ "$sel_mode" = none ]; then
            bt_sel=$(echo "$SEL" | jq -r '.backend.run')
            out backend_files "$(echo "$SEL" | jq -r '.backend.files | join(" ")')"
            if [ "$(echo "$SEL" | jq -r '.e2e.mode')" = specs ]; then out e2e_only "$(echo "$SEL" | jq -r '.e2e.specs | join(" ")')"; else out e2e_only ""; fi
            if [ "$(echo "$SEL" | jq -r '.vitest.mode')" = files ]; then out vitest_files "$(echo "$SEL" | jq -r '.vitest.files | join(" ")')"; else out vitest_files "ALL"; fi
          else
            bt_sel=true; out backend_files ""; out e2e_only ""; out vitest_files "ALL"
          fi
          if [ "$all" = true ]; then
            for k in backend frontend e2e docker; do out $k true; done
            out e2e_smoke false
            out backend_tests true
          else
            b=false; fe=false; e=false; sm=false; d=false
            if has backend_all; then b=true; fi
            if has frontend_all; then fe=true; fi
            # e2e drives both halves. The full matrix runs when the frontend, e2e itself or the API
            # contract snapshot changes; a change only under backend/ runs the short smoke subset
            # (a schema change fails the backend test until the snapshot is regenerated, which then
            # selects the full matrix). Pushes to main, merge groups and Full always run the full matrix.
            if has e2e || has contract || [ $fe = true ]; then e=true; elif [ $b = true ]; then sm=true; fi
            if has docker; then d=true; fi
            out backend $b; out frontend $fe; out e2e $e; out e2e_smoke $sm; out docker $d
            # Backend files changed, but none of the tests they affect (say, only a README under backend/): the test
            # jobs have nothing to do. The lint, types and migration job still runs.
            if [ $b = true ] && [ "$bt_sel" = true ]; then out backend_tests true; else out backend_tests false; fi
          fi

  backend-static:
    name: Backend (lint, types, migrations)
    needs: [changes]
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://agent:agent@localhost:5432/agent
      PGPASSWORD: agent
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked

      # Two migrations with the same parent (say, two 0022s from parallel branches) leave
      # several heads and break `alembic upgrade head`; catch it before the slower steps.
      - name: One migration head
        run: |
          uv run alembic heads
          test "$(uv run alembic heads | wc -l)" -eq 1 || { echo "::error::alembic has more than one head; renumber or merge the new migration"; exit 1; }

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Format
        run: uv run ruff format --check .

      - name: Type check
        run: uv run mypy

      - name: Migrations apply, match the models, and roll back
        run: |
          uv run alembic upgrade head
          uv run alembic check
          uv run alembic downgrade base
          uv run alembic upgrade head

  backend-tests:
    name: Backend tests (shard ${{ matrix.shard }}/2)
    needs: [changes]
    if: needs.changes.outputs.backend_tests == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      DATABASE_URL: postgresql+psycopg://agent:agent@localhost:5432/agent
      TEST_DATABASE_URL: postgresql+psycopg://agent:agent@localhost:5432/agent_test
      PGPASSWORD: agent
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.11.32"
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install Python and dependencies
        run: |
          uv python install
          uv sync --locked

      # The suite is split by test module (--shard, tests/sharding.py) over two runners, each running
      # pytest-xdist with one worker per core on its own database (tests/conftest.py). To debug a
      # failure that might be order or parallelism related, run `uv run pytest -p no:xdist`.
      # Coverage slows the suite down and nobody reads it on a pull request, so it is measured on
      # main and in the Full run only (each shard reports its own half). --durations lists the
      # slowest tests either way.
      #
      # A pull request runs only the test files of the modules it changes and of the modules that import them
      # (needs.changes.outputs.backend_files, docs/design/test-modules.md); the selected files are still split over
      # the two shards. Empty means everything. A shard that gets none of the selected files exits 5, which is fine.
      - name: Tests
        env:
          EVENT: ${{ github.event_name }}
          SHARD: ${{ matrix.shard }}/2
          FILES: ${{ needs.changes.outputs.backend_files }}
        run: |
          psql -h localhost -U agent -d agent -c "CREATE DATABASE agent_test"
          if [ -n "$FILES" ]; then echo "Selected $(echo $FILES | wc -w) test files: $FILES"; else echo "Running the whole suite"; fi
          set +e
          case "$EVENT" in
            pull_request|merge_group) uv run pytest -n auto --shard "$SHARD" --durations=25 $FILES ;;
            *) uv run pytest -n auto --shard "$SHARD" --durations=25 --cov --cov-report=term-missing:skip-covered ;;
          esac
          rc=$?
          if [ "$rc" -eq 5 ] && [ -n "$FILES" ]; then echo "None of the selected test files fell on this shard."; rc=0; fi
          exit $rc

  frontend:
    name: Frontend (lint, types, build)
    needs: [changes]
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # Next's build cache: unchanged modules are not recompiled. Keyed on the lockfile and the sources;
      # an older entry for the same lockfile is a valid starting point.
      - uses: actions/cache@v6
        with:
          path: frontend/.next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-${{ hashFiles('frontend/**/*.ts', 'frontend/**/*.tsx', 'frontend/**/*.css') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('frontend/package-lock.json') }}-

      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run typecheck
      # Only the unit tests of the changed feature groups on a pull request (docs/design/test-modules.md); all of them
      # for shared code, on main and when selection is off.
      - name: Unit tests
        env:
          VITEST_FILES: ${{ needs.changes.outputs.vitest_files }}
        run: |
          if [ "$VITEST_FILES" = ALL ] || [ -z "$VITEST_FILES" ]; then npm test; else npx vitest run --passWithNoTests $VITEST_FILES; fi
      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  e2e:
    name: End-to-end (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    # Runs beside backend, not after it: it builds its own API and web. A frontend failure still stops it,
    # and the CI result gate still requires backend, so main loses no protection (docs/0013).
    needs: [changes, frontend]
    # frontend may be skipped (nothing in it changed); a failure still blocks.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.e2e == 'true' }}
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_PG_ADMIN_URL: postgresql://agent:agent@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      # Backend, frontend build, Playwright and its browser, with caches: .github/actions/e2e-setup.
      - uses: ./.github/actions/e2e-setup

      - name: Run end-to-end tests
        working-directory: e2e
        # Spec files are split by measured time (e2e/shard-timings.json), not test count.
        # E2E_ONLY (a pull request that only needs some specs, docs/design/test-modules.md) limits the list; a shard
        # that gets none of them has nothing to do.
        env:
          E2E_ONLY: ${{ needs.changes.outputs.e2e_only }}
        run: |
          files=$(node scripts/shard.mjs ${{ matrix.shard }} 4)
          if [ -z "$files" ] && [ -n "$E2E_ONLY" ]; then echo "None of the selected specs fell on this shard."; exit 0; fi
          test -n "$files" || { echo "::error::shard.mjs listed no spec files"; exit 1; }
          npx playwright test $files

      - name: Run the API proxy contract tests
        if: matrix.shard == 1 && needs.changes.outputs.e2e_only == ''
        working-directory: e2e
        run: E2E_PROXY=1 npx playwright test --project=proxy

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-${{ matrix.shard }}
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  e2e-smoke:
    name: End-to-end (smoke)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Runs beside backend, not after it: it builds its own API and web. A frontend failure still stops it,
    # and the CI result gate still requires backend, so main loses no protection (docs/0013).
    needs: [changes, frontend]
    # frontend may be skipped (nothing in it changed); a failure still blocks.
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.e2e_smoke == 'true' }}
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: agent
          POSTGRES_PASSWORD: agent
          POSTGRES_DB: agent
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agent -d agent"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      E2E_PG_ADMIN_URL: postgresql://agent:agent@localhost:5432/postgres
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      # Backend, frontend build, Playwright and its browser, with caches: .github/actions/e2e-setup.
      - uses: ./.github/actions/e2e-setup

      # Tests tagged @smoke in their title: sign-up and log-in, hire, the introduction, chat and
      # streaming, memory, approvals, a settings page, a console page, owner isolation.
      - name: Run the smoke tests
        working-directory: e2e
        run: |
          npx playwright test --list --grep @smoke | tail -1
          npx playwright test --grep @smoke

      - name: Upload report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-smoke
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 7

  images:
    name: Docker images build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # Runs beside backend, not after it: it builds its own API and web. A frontend failure still stops it,
    # and the CI result gate still requires backend, so main loses no protection (docs/0013).
    needs: [changes, frontend]
    if: ${{ !cancelled() && !contains(needs.*.result, 'failure') && needs.changes.outputs.docker == 'true' }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4

      - name: Production compose file is valid
        run: |
          cp .env.prod.example .env
          docker compose -f docker-compose.prod.yml config -q
        env:
          # The example leaves secrets blank on purpose; any value satisfies the required-variable checks.
          POSTGRES_PASSWORD: ci
          SECRETS_MASTER_KEY: ci
          ADMIN_TOKEN: ci

      - name: Build the API image
        uses: docker/build-push-action@v7
        with:
          context: backend
          push: false
          tags: superaide-api:ci
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build the web image
        uses: docker/build-push-action@v7
        with:
          context: frontend
          push: false
          tags: superaide-web:ci
          cache-from: type=gha,scope=web
          cache-to: type=gha,mode=max,scope=web

      - name: Build the Caddy image (HTTPS proxy with rate limiting)
        uses: docker/build-push-action@v7
        with:
          context: deploy/caddy
          push: false
          load: true
          tags: superaide-caddy:ci
          cache-from: type=gha,scope=caddy
          cache-to: type=gha,mode=max,scope=caddy

      - name: Caddyfile is valid
        run: docker run --rm -e DOMAIN=example.com superaide-caddy:ci caddy validate --config /etc/caddy/Caddyfile

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # on a pull request, gitleaks-action lists its commits
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # .gitleaks.toml uses [[allowlists]] tables, which need gitleaks 8.25 or later
          # (the action's default, 8.24.3, ignores them).
          GITLEAKS_VERSION: 8.28.0

  # Every feat or fix PR that changes source ships a test (CONTRIBUTING.md, docs/0013). Only runs on pull
  # requests. Title, labels and files are read live from the API, so editing the title or adding the
  # `tests-not-needed` label and re-running this job is enough. No third-party action, no checkout of the PR.
  tests-required:
    name: Tests required (feat and fix)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: scripts/tests_required.py
          sparse-checkout-cone-mode: false
      - name: Feat and fix change tests too
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          set -euo pipefail
          # Only the script is checked out; the PR itself is read through the API.
          pr=$(gh api "repos/$REPO/pulls/$PR")
          export PR_TITLE=$(echo "$pr" | jq -r .title)
          export PR_LABELS=$(echo "$pr" | jq -r '[.labels[].name] | join(",")')
          gh api --paginate "repos/$REPO/pulls/$PR/files" --jq '.[].filename' | python3 scripts/tests_required.py

  # The one check to require in branch protection. Skipped jobs count as success, a failed or
  # cancelled one (or an unexpected state) fails it. Without this, a required job that was
  # skipped would stay pending forever.
  result:
    name: CI result
    if: always()
    needs: [changes, backend-static, backend-tests, frontend, e2e, e2e-smoke, images, secrets, tests-required]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Every needed job succeeded or was skipped
        env:
          NEEDS: ${{ toJSON(needs) }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "$NEEDS" | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          # changes and the secret scan are never skipped.
          for j in changes secrets; do
            [ "$(echo "$NEEDS" | jq -r --arg j "$j" '.[$j].result')" = success ] || { echo "::error::$j did not succeed"; exit 1; }
          done
          bad=$(echo "$NEEDS" | jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | .key')
          [ -z "$bad" ] || { echo "::error::failed, cancelled or unknown: $bad"; exit 1; }
          # A job skipped although its filter asked for it ran into an upstream problem: fail.
          out() { echo "$NEEDS" | jq -r --arg k "$1" '.changes.outputs[$k]'; }
          res() { echo "$NEEDS" | jq -r --arg j "$1" '.[$j].result'; }
          [ "$(out backend)" != true ] || [ "$(res backend-static)" = success ] || { echo "::error::backend-static was required but is $(res backend-static)"; exit 1; }
          # Test selection (docs/design/test-modules.md): backend-tests is required whenever it was selected, and ALWAYS
          # on anything but a pull request (main, merge group, Full, manual); a selection can only trim a pull request.
          if [ "$EVENT" != pull_request ]; then
            [ "$(out backend_tests)" = true ] || { echo "::error::event $EVENT must run all backend tests"; exit 1; }
            [ "$(out selection_mode)" = full ] || { echo "::error::event $EVENT must select the full suite, got $(out selection_mode)"; exit 1; }
          fi
          [ "$(out backend_tests)" != true ] || [ "$(res backend-tests)" = success ] || { echo "::error::backend-tests was required but is $(res backend-tests)"; exit 1; }
          [ "$(out frontend)" != true ] || [ "$(res frontend)" = success ] || { echo "::error::frontend was required but is $(res frontend)"; exit 1; }
          # End-to-end: either the full matrix or the smoke subset must have succeeded, never neither.
          full=$(out e2e); smoke=$(out e2e_smoke)
          [ "$full" != true ] || [ "$smoke" != true ] || { echo "::error::both the full and the smoke e2e were selected"; exit 1; }
          # Anything but a pull request (main, merge group, Full, manual) must run the full matrix.
          if [ "$EVENT" != pull_request ] && [ "$full" != true ]; then echo "::error::event $EVENT must run the full e2e"; exit 1; fi
          # Backend or frontend code changed but no e2e was selected: an upstream problem, fail closed.
          if { [ "$(out backend)" = true ] || [ "$(out frontend)" = true ]; } && [ "$full" != true ] && [ "$smoke" != true ]; then
            echo "::error::code changed but no e2e path was selected"; exit 1
          fi
          [ "$full" != true ] || [ "$(res e2e)" = success ] || { echo "::error::full e2e was required but is $(res e2e)"; exit 1; }
          [ "$smoke" != true ] || [ "$(res e2e-smoke)" = success ] || { echo "::error::smoke e2e was required but is $(res e2e-smoke)"; exit 1; }
          want=$(echo "$NEEDS" | jq -r '.changes.outputs.docker')
          [ "$want" != true ] || [ "$(echo "$NEEDS" | jq -r '.images.result')" = success ] || { echo "::error::images was required but did not succeed"; exit 1; }
          # tests-required only runs on pull requests (the job decides by PR title type, so a docs PR
          # passes it). Anywhere else it is skipped. On a pull request a skipped one fails closed.
          tr=$(echo "$NEEDS" | jq -r '.["tests-required"].result')
          if [ "$EVENT" = pull_request ]; then
            [ "$tr" = success ] || { echo "::error::tests-required is $tr: a feat or fix pull request must change a test file (see its log)"; exit 1; }
          fi
