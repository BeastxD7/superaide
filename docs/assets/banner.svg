<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 320" width="1280" height="320" role="img" aria-labelledby="t d">
  <title id="t">Superaide</title>
  <desc id="d">Superaide: your own assistant that earns trust. A pastel violet, pink and blue orb with two eyes, next to the wordmark.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f1ecff"/>
      <stop offset="0.55" stop-color="#f7ebfb"/>
      <stop offset="1" stop-color="#e6eeff"/>
    </linearGradient>
    <linearGradient id="body" x1="0.1" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#d9c9ff"/>
      <stop offset="0.38" stop-color="#b9a6ff"/>
      <stop offset="0.68" stop-color="#f3b6f5"/>
      <stop offset="1" stop-color="#9cc7ff"/>
    </linearGradient>
    <radialGradient id="shine" cx="0.32" cy="0.26" r="0.48">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="shade" cx="0.5" cy="0.38" r="0.66">
      <stop offset="0.72" stop-color="#5028a0" stop-opacity="0"/>
      <stop offset="1" stop-color="#5028a0" stop-opacity="0.24"/>
    </radialGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#b9a6ff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#b9a6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="word" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4b2fb0"/>
      <stop offset="1" stop-color="#7a4fd8"/>
    </linearGradient>
  </defs>
  <rect width="1280" height="320" rx="28" fill="url(#bg)"/>
  <circle cx="1130" cy="40" r="150" fill="#f3b6f5" opacity="0.28"/>
  <circle cx="1220" cy="300" r="120" fill="#9cc7ff" opacity="0.3"/>
  <circle cx="90" cy="300" r="110" fill="#d9c9ff" opacity="0.4"/>
  <!-- the orb -->
  <circle cx="230" cy="160" r="150" fill="url(#glow)"/>
  <g transform="translate(130 60) scale(3.125)">
    <circle cx="32" cy="32" r="30" fill="url(#body)"/>
    <circle cx="32" cy="32" r="30" fill="url(#shade)"/>
    <circle cx="32" cy="32" r="30" fill="url(#shine)"/>
    <rect x="21.5" y="25.5" width="7" height="13" rx="3.5" fill="#1d1640"/>
    <rect x="35.5" y="25.5" width="7" height="13" rx="3.5" fill="#1d1640"/>
  </g>
  <!-- wordmark and tagline (system fonts) -->
  <text x="380" y="168" font-family="ui-rounded, 'SF Pro Rounded', 'Segoe UI', system-ui, -apple-system, Helvetica, Arial, sans-serif" font-size="96" font-weight="700" letter-spacing="-2" fill="url(#word)">Superaide</text>
  <text x="384" y="212" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="25" fill="#1d1640">Your own assistant that earns trust.</text>
  <text x="384" y="248" font-family="system-ui, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="20" fill="#4a4272">Privacy decided in code. Autonomy earned step by step.</text>
</svg>
