<circle cx="1022" cy="705" r="10.5" fill="#334155"/><text x="1022" y="709.2" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">3</text>
<path d="M1322 705 L1382 705" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="0" marker-end="url(#arr-solid)"/>
<circle cx="1352" cy="705" r="10.5" fill="#334155"/><text x="1352" y="709.2" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">4</text>
<path d="M1133 770 L1133 790 Q1133 800 1123 800 L1118 800 Q1108 800 1108 810 L1108 830" fill="none" stroke="#dc2626" stroke-width="2" stroke-dasharray="0" marker-end="url(#arr-deny)"/>
