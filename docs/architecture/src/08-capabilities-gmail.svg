<circle cx="362" cy="705" r="10.5" fill="#334155"/><text x="362" y="709.2" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<path d="M662 705 L722 705" fill="none" stroke="#334155" stroke-width="2" stroke-dasharray="0" marker-end="url(#arr-solid)"/>
<circle cx="692" cy="705" r="10.5" fill="#334155"/><text x="692" y="709.2" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">2</text>
