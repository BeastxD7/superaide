<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1090" viewBox="0 0 1920 1090" font-family="-apple-system, 'Helvetica Neue', Helvetica, Arial, sans-serif">
<defs><marker id="arr-solid" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#334155"/></marker><marker id="arrs-solid" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#334155"/></marker><marker id="arr-dashed" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#64748b"/></marker><marker id="arrs-dashed" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#64748b"/></marker><marker id="arr-deny" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#dc2626"/></marker><marker id="arrs-deny" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#dc2626"/></marker><marker id="arr-ok" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#16a34a"/></marker><marker id="arrs-ok" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#16a34a"/></marker><marker id="arr-data" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 1 L10 5 L0 9 z" fill="#7c3aed"/></marker><marker id="arrs-data" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 1 L10 5 L0 9 z" fill="#7c3aed"/></marker></defs>
<rect width="1920" height="1090" fill="#ffffff"/>
<text x="40" y="52" font-size="30" font-weight="800" fill="#0f172a">Capabilities, connectors and the Gmail send flow</text>
<text x="40" y="78" font-size="15" fill="#64748b">Each capability is a registered skill with declared effects. Reads are free; anything that reaches another person goes through an approval card.</text>
<rect x="0" y="0" width="8" height="1090" fill="#6d5dfc"/>
<rect x="40" y="120" width="1840" height="440" rx="18" fill="#f2f7ff" stroke="#4f8ef7" stroke-width="1.6" stroke-dasharray="0"/>
<g transform="translate(56 131) scale(0.9166666666666666)" fill="none" stroke="#1d4ed8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.83 2.18a2 2 0 0 0-1.66 0L2.6 6.08a1 1 0 0 0 0 1.83l8.58 3.91a2 2 0 0 0 1.66 0l8.58-3.9a1 1 0 0 0 0-1.83z"/><path d="M2 12a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 12"/><path d="M2 17a1 1 0 0 0 .58.91l8.6 3.91a2 2 0 0 0 1.65 0l8.58-3.9A1 1 0 0 0 22 17"/></g>
<text x="88" y="148" font-size="15" font-weight="700" letter-spacing="0.6" fill="#1d4ed8">CAPABILITIES (DASHBOARD, CAPABILITIES)</text>
<rect x="40" y="590" width="1840" height="390" rx="18" fill="#f1faf3" stroke="#34a853" stroke-width="1.6" stroke-dasharray="0"/>
<g transform="translate(56 601) scale(0.9166666666666666)"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z" fill="#EA4335"/></g>
<text x="88" y="618" font-size="15" font-weight="700" letter-spacing="0.6" fill="#15803d">GMAIL: SEND WITH APPROVAL (INTEGRATIONS/GMAIL/SKILL.PY)</text>
<rect x="62" y="170" width="1740" height="320" rx="10" fill="#fff" stroke="#cbd5e1"/>
<path d="M62 210 L62 180 Q62 170 72 170 L1792 170 Q1802 170 1802 180 L1802 210 Z" fill="#0f172a"/>
<text x="177" y="195" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Capability</text>
<text x="572" y="195" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">What Ava can do</text>
<text x="1017" y="195" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Needs your approval?</text>
<text x="1492" y="195" font-size="13" font-weight="700" fill="#fff" text-anchor="middle">Where its settings live</text>
<text x="74" y="242.5" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">Gmail</text>
<text x="572" y="242.5" font-size="12" font-weight="400" fill="#1e293b" text-anchor="middle">Search and read threads, draft replies, send, compose</text>
<rect x="856" y="214" width="322" height="48" rx="7" fill="#fef9c3"/>
<text x="1017" y="242.5" font-size="12.5" font-weight="700" fill="#854d0e" text-anchor="middle">Send and compose: always</text>
<text x="1492" y="242.5" font-size="12" font-weight="400" fill="#1e293b" text-anchor="middle">Capabilities, Gmail: Reading, Drafts, Signature. Stored per owner on the installed skill</text>
<rect x="62" y="266" width="1740" height="56" fill="#f8fafc"/>
<text x="74" y="298.5" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">Google Calendar</text>
<text x="572" y="298.5" font-size="12" font-weight="400" fill="#1e293b" text-anchor="middle">Read events and free time; create, move, decline events</text>
<rect x="856" y="270" width="322" height="48" rx="7" fill="#fef9c3"/>
<text x="1017" y="298.5" font-size="12.5" font-weight="700" fill="#854d0e" text-anchor="middle">Writes: yes, unless a mandate covers them</text>
<text x="1492" y="298.5" font-size="12" font-weight="400" fill="#1e293b" text-anchor="middle">Capabilities, Google Calendar: Reading, writes on or off</text>
<text x="74" y="354.5" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">Web research</text>
<text x="572" y="354.5" font-size="12" font-weight="400" fill="#1e293b" text-anchor="middle">Search (Brave or the model's own) and read pages, with citations</text>
<rect x="856" y="326" width="322" height="48" rx="7" fill="#dcfce7"/>
<text x="1017" y="354.5" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">No, but the turn is marked tainted</text>
<text x="1492" y="354.5" font-size="12" font-weight="400" fill="#1e293b" text-anchor="middle">Capabilities, Web research: searches and pages per step. WEB_TOOLS_ENABLED</text>
<rect x="62" y="378" width="1740" height="56" fill="#f8fafc"/>
<text x="74" y="410.5" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">Reminders</text>
<text x="572" y="410.5" font-size="12" font-weight="400" fill="#1e293b" text-anchor="middle">Create and list reminders, delivered in the app and optionally Telegram or Slack</text>
<rect x="856" y="382" width="322" height="48" rx="7" fill="#dcfce7"/>
<text x="1017" y="410.5" font-size="12.5" font-weight="700" fill="#166534" text-anchor="middle">No</text>
<text x="1492" y="410.5" font-size="12" font-weight="400" fill="#1e293b" text-anchor="middle">Reminders page; auto-close days in Settings</text>
<text x="74" y="466.5" font-size="12.5" font-weight="700" fill="#1e293b" text-anchor="start">Voice</text>
<text x="572" y="466.5" font-size="12" font-weight="400" fill="#1e293b" text-anchor="middle">Live voice calls and the spoken introduction (Deepgram when a key is set)</text>
<rect x="856" y="438" width="322" height="48" rx="7" fill="#fef9c3"/>
<text x="1017" y="466.5" font-size="12.5" font-weight="700" fill="#854d0e" text-anchor="middle">Voice actions: confirm in the app</text>
<text x="1492" y="466.5" font-size="12" font-weight="400" fill="#1e293b" text-anchor="middle">Connections (Deepgram key); VOICE_PROVIDER. Calls have their own cap</text>
<rect x="62" y="170" width="1740" height="320" rx="10" fill="none" stroke="#cbd5e1"/>
<rect x="62" y="495" width="1796" height="33" rx="10" fill="#f2f7ff" stroke="#4f8ef7" stroke-opacity="0.7"/>
<rect x="62" y="503" width="4" height="17" rx="2" fill="#4f8ef7"/>
<text x="78" y="517" font-size="12.5" fill="#334155">Credentials for every connector are verified against the service, encrypted in the vault, and shown only as a hint. Gmail and Calendar content is looked up live and not copied into memory; CONNECTOR_FACTS_ENABLED (off) can keep up to 3 short facts per item.</text>
<rect x="63" y="643" width="270" height="130" rx="12" fill="#0f172a" opacity="0.07"/><rect x="62" y="640" width="270" height="130" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="72" y="685" width="40" height="40" rx="10" fill="#f1faf3" stroke="#34a853" stroke-opacity="0.45"/><g transform="translate(80 693) scale(1)" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 18V5"/><path d="M15 13a4.17 4.17 0 01-3-4 4.17 4.17 0 01-3 4"/><path d="M17.707 6.294A3 3 0 1012 5a3 3 0 10-5.707 1.294"/><path d="M17.996 5.125a4 4 0 012.526 5.77"/><path d="M18 18a4 4 0 002-7.465"/><path d="M19.967 17.482a4 4 0 11-7.967.517 4 4 0 11-7.967-.517"/><path d="M6 18a4 4 0 01-2-7.465"/><path d="M6.004 5.125a4 4 0 00-2.526 5.77"/></g><text x="120" y="671" font-size="14.5" font-weight="700" fill="#0f172a">Model calls gmail_send</text><text x="120" y="689" font-size="14.5" font-weight="700" fill="#0f172a">or compose</text><text x="120" y="707" font-size="12" fill="#64748b">Recipients are chosen by code</text><text x="120" y="722" font-size="12" fill="#64748b">from the thread or an address</text><text x="120" y="737" font-size="12" fill="#64748b">you typed; noreply addresses are</text><text x="120" y="752" font-size="12" fill="#64748b">flagged</text>
<rect x="393" y="643" width="270" height="130" rx="12" fill="#0f172a" opacity="0.07"/><rect x="392" y="640" width="270" height="130" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="402" y="685" width="40" height="40" rx="10" fill="#f1faf3" stroke="#34a853" stroke-opacity="0.45"/><g transform="translate(410 693) scale(1)"><path d="M24 5.457v13.909c0 .904-.732 1.636-1.636 1.636h-3.819V11.73L12 16.64l-6.545-4.91v9.273H1.636A1.636 1.636 0 0 1 0 19.366V5.457c0-2.023 2.309-3.178 3.927-1.964L5.455 4.64 12 9.548l6.545-4.91 1.528-1.145C21.69 2.28 24 3.434 24 5.457z" fill="#EA4335"/></g><text x="450" y="678.5" font-size="14.5" font-weight="700" fill="#0f172a">A real draft is saved in</text><text x="450" y="696.5" font-size="14.5" font-weight="700" fill="#0f172a">Gmail</text><text x="450" y="714.5" font-size="12" fill="#64748b">With the signature on, two</text><text x="450" y="729.5" font-size="12" fill="#64748b">drafts: signed, and a plain</text><text x="450" y="744.5" font-size="12" fill="#64748b">alternative</text>
<rect x="723" y="643" width="270" height="130" rx="12" fill="#0f172a" opacity="0.07"/><rect x="722" y="640" width="270" height="130" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="732" y="685" width="40" height="40" rx="10" fill="#f1faf3" stroke="#34a853" stroke-opacity="0.45"/><g transform="translate(740 693) scale(1)" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.364 13.634a2 2 0 0 0-.506.854l-.837 2.87a.5.5 0 0 0 .62.62l2.87-.837a2 2 0 0 0 .854-.506l4.013-4.009a1 1 0 0 0-3.004-3.004z"/><path d="M14.487 7.858A1 1 0 0 1 14 7V2"/><path d="M20 19.645V20a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l2.516 2.516"/><path d="M8 18h1"/></g><text x="780" y="680" font-size="14.5" font-weight="700" fill="#0f172a">Approval card is sealed</text><text x="780" y="698" font-size="12" fill="#64748b">kind gmail_send; payload hash</text><text x="780" y="713" font-size="12" fill="#64748b">plus a hash of the draft's</text><text x="780" y="728" font-size="12" fill="#64748b">recipients, subject, text and</text><text x="780" y="743" font-size="12" fill="#64748b">html</text>
<rect x="1053" y="643" width="270" height="130" rx="12" fill="#0f172a" opacity="0.07"/><rect x="1052" y="640" width="270" height="130" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="1062" y="685" width="40" height="40" rx="10" fill="#f1faf3" stroke="#34a853" stroke-opacity="0.45"/><g transform="translate(1070 693) scale(1)" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/></g><text x="1110" y="687.5" font-size="14.5" font-weight="700" fill="#0f172a">You review it</text><text x="1110" y="705.5" font-size="12" fill="#64748b">Dashboard, Approvals. You can</text><text x="1110" y="720.5" font-size="12" fill="#64748b">untick the signature for this</text><text x="1110" y="735.5" font-size="12" fill="#64748b">email</text>
<rect x="1383" y="643" width="450" height="130" rx="12" fill="#0f172a" opacity="0.07"/><rect x="1382" y="640" width="450" height="130" rx="12" fill="#fff" stroke="#34a853" stroke-width="2"/><rect x="1392" y="685" width="40" height="40" rx="10" fill="#f1faf3" stroke="#34a853" stroke-opacity="0.45"/><g transform="translate(1400 693) scale(1)" fill="none" stroke="#15803d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.536 21.686a.5.5 0 0 0 .937-.024l6.5-19a.496.496 0 0 0-.635-.635l-19 6.5a.5.5 0 0 0-.024.937l7.93 3.18a2 2 0 0 1 1.112 1.11z"/><path d="m21.854 2.147-10.94 10.939"/></g><text x="1440" y="687.5" font-size="14.5" font-weight="700" fill="#0f172a">send_approved()</text><text x="1440" y="705.5" font-size="12" fill="#64748b">Re-fetches the draft and compares hashes. Changed: &quot;Not</text><text x="1440" y="720.5" font-size="12" fill="#64748b">sent&quot;. Same: send the draft, audit gmail_sent, delete the</text><text x="1440" y="735.5" font-size="12" fill="#64748b">spare draft, record the card</text>
<rect x="1053" y="833" width="560" height="90" rx="12" fill="#0f172a" opacity="0.07"/><rect x="1052" y="830" width="560" height="90" rx="12" fill="#fff" stroke="#dc2626" stroke-width="2"/><rect x="1062" y="855" width="40" height="40" rx="10" fill="#fff4f6" stroke="#ef5b7b" stroke-opacity="0.45"/><g transform="translate(1070 863) scale(1)" fill="none" stroke="#be123c" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M4.929 4.929 19.07 19.071"/></g><text x="1110" y="872.5" font-size="14.5" font-weight="700" fill="#0f172a">Reject</text><text x="1110" y="890.5" font-size="12" fill="#64748b">Both drafts are deleted. Nothing leaves your Gmail account</text>
<rect x="723" y="833" width="270" height="90" rx="12" fill="#0f172a" opacity="0.07"/><rect x="722" y="830" width="270" height="90" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="732" y="855" width="40" height="40" rx="10" fill="#fff9ec" stroke="#f2a900" stroke-opacity="0.45"/><g transform="translate(740 863) scale(1)" fill="none" stroke="#a16207" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></g><text x="780" y="865" font-size="14.5" font-weight="700" fill="#0f172a">Reading is limited</text><text x="780" y="883" font-size="12" fill="#64748b">Credential mail hidden; code</text><text x="780" y="898" font-size="12" fill="#64748b">reads need step-up</text>
<rect x="62" y="830" width="630" height="104" rx="10" fill="#fff9ec" stroke="#f2a900" stroke-opacity="0.7"/>
<rect x="62" y="838" width="4" height="88" rx="2" fill="#f2a900"/>
<text x="78" y="852" font-size="13" font-weight="700" fill="#a16207">Worked example</text>
<text x="78" y="872" font-size="12.5" fill="#334155">Example: Meera emails the owner asking to move a meeting. Ava reads the thread (read</text>
<text x="78" y="889" font-size="12.5" fill="#334155">settings apply, the turn is tainted), drafts a reply, and the owner sees an approval card.</text>
<text x="78" y="906" font-size="12.5" fill="#334155">Only on approve does it send, signed &quot;Ava, personal assistant of the owner&quot; with a link to</text>
<text x="78" y="923" font-size="12.5" fill="#334155">a signed page.</text>
<rect x="1643" y="833" width="190" height="90" rx="12" fill="#0f172a" opacity="0.07"/><rect x="1642" y="830" width="190" height="90" rx="12" fill="#fff" stroke="#cbd5e1" stroke-width="1.3"/><rect x="1652" y="855" width="40" height="40" rx="10" fill="#fff9ec" stroke="#f2a900" stroke-opacity="0.45"/><g transform="translate(1660 863) scale(1)" fill="none" stroke="#a16207" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2.586 17.414A2 2 0 0 0 2 18.828V21a1 1 0 0 0 1 1h3a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h1a1 1 0 0 0 1-1v-1a1 1 0 0 1 1-1h.172a2 2 0 0 0 1.414-.586l.814-.814a6.5 6.5 0 1 0-4-4z"/><circle cx="16.5" cy="7.5" r=".5" fill="currentColor"/></g><text x="1700" y="865" font-size="14.5" font-weight="700" fill="#0f172a">Token in vault</text><text x="1700" y="883" font-size="12" fill="#64748b">Refresh token, slot</text><text x="1700" y="898" font-size="12" fill="#64748b">google</text>
<rect x="40" y="1028" width="1840" height="48" rx="12" fill="#fff" stroke="#e2e8f0"/>
<text x="58" y="1020" font-size="11" font-weight="700" letter-spacing="1" fill="#94a3b8">LEGEND</text>
<circle cx="70" cy="1052" r="10.5" fill="#334155"/><text x="70" y="1056.2" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">1</text>
<text x="90" y="1057" font-size="12.5" fill="#334155">Numbered step: follow 1, 2, 3</text>
<path d="M316.125 1052 H350.125" stroke="#334155" stroke-width="2" marker-end="url(#arr-solid)"/>
<text x="364.125" y="1057" font-size="12.5" fill="#334155">Request or data flow</text>
<path d="M530.625 1052 H564.625" stroke="#64748b" stroke-width="2" stroke-dasharray="7 6" marker-end="url(#arr-dashed)"/>
<text x="578.625" y="1057" font-size="12.5" fill="#334155">Background or asynchronous</text>
<path d="M784.875 1052 H818.875" stroke="#dc2626" stroke-width="2" marker-end="url(#arr-deny)"/>
<text x="832.875" y="1057" font-size="12.5" fill="#334155">Refused or blocked</text>
<text x="1862" y="1057" font-size="12" fill="#94a3b8" text-anchor="end">Superaide  |  docs/architecture/src/08-capabilities-gmail.mjs</text>
