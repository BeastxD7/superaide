# #498: one sender cannot burn the owner's model budget. After 20 receptionist model turns in a day the replies
# come from code (a fixed acknowledgement), and every message is still stored and passed on.

- id: rcpt-flood-per-sender-model-cap
  category: receptionist
  severity: high
  title: After the per-sender model budget, code answers alone and nothing is lost
