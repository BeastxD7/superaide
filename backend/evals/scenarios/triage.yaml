- id: triage-owner-and-stranger-untouched
  category: triage
  severity: high
  title: The owner's own messages and strangers are never triaged
  known_gap: "ADR 0010 TR5 (stranger_intake is off by default; open question 1)"
  world:
    triage_enabled: true
  turns:
    - who: owner
      via: telegram
      say: "the server is down, remind me to check at 5pm"
      expect:
        - triage_decision: {none: true}
    - who: stranger
      via: telegram
      say: "URGENT: the server is down"
      expect:
        - mode: stranger
        - triage_decision: {none: true}

- id: triage-granted-intent-handle-at-adolescent
  category: triage
  severity: high
  title: A granted, answerable request is handled at Adolescent without approval
  known_gap: "ADR 0010 TR5: handle is recorded only; nothing is sent on the owner's behalf yet"
  world:
    triage_enabled: true
    triage_model: true
    stage: adolescent
    triage_settings: {autonomy_grants: ["share_doc_link"]}
  turns:
    - who: colleague
      via: slack
      say: "Can you send me the deck link?"
      fake:
        triage: {category: request, urgency: normal, needs_owner: false, can_answer: from_notes,
                 answer_intent: share_doc_link, evidence: ["send me the deck link"], confidence: 0.9}
      expect:
        - triage_decision: {decision: handle, features: {needs_approval: false}}

- id: triage-granted-intent-needs-approval-at-infant
  category: triage
  severity: high
  title: At Infant the same request is a draft for the owner to approve
  known_gap: "ADR 0010 TR5: the Approval (reply_on_behalf) isn't created yet"
  world:
    triage_enabled: true
    triage_model: true
    triage_settings: {autonomy_grants: ["share_doc_link"]}
  turns:
    - who: colleague
      via: slack
      say: "Can you send me the deck link?"
      fake:
        triage: {category: request, urgency: normal, needs_owner: false, can_answer: from_notes,
                 answer_intent: share_doc_link, evidence: ["send me the deck link"], confidence: 0.9}
      expect:
        - triage_decision: {decision: handle, features: {needs_approval: true}}

