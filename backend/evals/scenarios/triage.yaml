- id: triage-offline-is-rules-only-and-free
  category: triage
  severity: high
  title: With no model connected, every message still gets a decision, at no cost
  known_gap: "ADR 0010 TR5: the sender still gets a model reply"
  world:
    triage_enabled: true
  turns:
    - who: colleague
      via: slack
      say: "Can we move our 1:1 to Thursday?"
      expect:
        - triage_decision: {decision: hold, rule_any: ["classifier:offline"]}
