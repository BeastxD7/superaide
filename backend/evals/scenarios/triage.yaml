  category: triage
  severity: medium
  title: While away, an urgent-topic message from a colleague is held back
  known_gap: "ADR 0010 TR5/TR8: away templates and the handover digest aren't built"
  world:
    triage_enabled: true
    urgent_topics: ["server down"]
    away_days: 3
  turns:
    - who: colleague
      via: slack
      say: "Heads up, the server is down"
      expect:
        - triage_decision: {decision: hold}
        - interrupt_count: 0

- id: triage-offline-is-rules-only-and-free
  category: triage
  severity: high
  title: With no model connected, every message still gets a decision, at no cost
  known_gap: "ADR 0010 TR5: the sender still gets a model reply"
  world:
    triage_enabled: true
  turns:
    - who: colleague
      via: slack
      say: "Can we move our 1:1 to Thursday?"
      expect:
        - triage_decision: {decision: hold, rule_any: ["classifier:offline"]}
    - who: contact
      via: slack
      say: "Loved the talk yesterday!"
      expect:
        - triage_decision: {decision: hold}

- id: triage-owner-and-stranger-untouched
  category: triage
  severity: high
  title: The owner's own messages and strangers are never triaged
  known_gap: "ADR 0010 TR5 (stranger_intake is off by default; open question 1)"
  world:
    triage_enabled: true
  turns:
    - who: owner
      via: telegram
      say: "the server is down, remind me to check at 5pm"
      expect:
        - triage_decision: {none: true}
    - who: stranger
      via: telegram
      say: "URGENT: the server is down"
      expect:
        - mode: stranger
        - triage_decision: {none: true}
