- id: triage-has-seen-never-before-an-ack
  category: triage
  severity: high
  title: Nothing told to the sender says the owner has seen it
  known_gap: "ADR 0010 TR5: sender templates; today the sender gets a model reply"
  world:
    triage_enabled: true
    interrupt_channel: telegram
    urgent_topics: ["server down"]
  turns:
    - who: vip
      via: slack
      say: "The server is down."
  checks:
    - outbound_excludes: ["has seen this", "has read", "saw your message"]

- id: triage-not-urgent-twice-is-recorded
  category: triage
  severity: medium
  title: '"Not urgent" twice on a sender is recorded as feedback'
  known_gap: "ADR 0010 TR6: two of these should suggest a sender_ceiling rule"
  clock: "14:00"
  world:
    triage_enabled: true
    interrupt_channel: telegram
    urgent_topics: ["server down"]
  turns:
    - who: vip
      via: slack
      say: "The server is down."
    - press: {verb: not_urgent, via: app}
    - advance: "+1h"
    - who: vip
      via: slack
      say: "Server down again (staging this time)."
    - press: {verb: not_urgent, via: app}
      expect:
        - triage_feedback: {feedback: not_urgent, count: 2}
        - escalation_state: {state: resolved}

