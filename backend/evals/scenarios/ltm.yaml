# Long-term memory (#51). Graded in code and offline: what is stored, and what the search serves to
# which audience. Nothing here depends on what the model writes, so a regression in learning, supersession,
# retrieval or the audience gate fails CI. The reply-quality checks (judge, reply_*) run live only.

# --- ltm_inputs: a fact told by each path is kept and found ------------------------------------
- id: ltm-in-chat
  category: ltm_inputs
  severity: high
  title: A fact said in the app chat is learned and found by a paraphrased question
  world: {learn_model: true}
  turns:
    - say: "FYI I'm vegetarian and I never eat mushrooms, please remember when booking dinners"
      fake:
        facts: [{content: "Shashank is vegetarian and never eats mushrooms.", category: preference}]
  checks:
    - memory: ["mushrooms"]
    - recall_top: {query: "does he eat mushrooms", contains: ["mushrooms"], k: 3}

- id: ltm-in-telegram
  category: ltm_inputs
  severity: high
  title: A fact said on Telegram is learned and found
  world: {learn_model: true}
  turns:
    - say: "my daughter Asha starts at Greenwood School in June, so mornings are for school runs"
      via: telegram
      fake:
        facts: [{content: "Shashank's daughter Asha starts at Greenwood School in June.", category: person}]
  checks:
    - recall_top: {query: "which school is Asha going to", contains: ["Greenwood"], k: 3}

- id: ltm-in-slack
  category: ltm_inputs
  severity: high
  title: A fact said on Slack is learned and found
  world: {learn_model: true}
  turns:
    - say: "btw the Pune office lead is Meera Nair, loop her in on anything about hiring"
      via: slack
      fake:
        facts: [{content: "Meera Nair leads the Pune office and is looped in on hiring.", category: work}]
  checks:
    - recall_top: {query: "who runs the Pune office", contains: ["Meera Nair"], k: 3}

- id: ltm-in-remember-command
  category: ltm_inputs
  severity: high
  title: '"Remember that ..." on Telegram is stored without any model, and found'
  turns:
    - say: "remember that the storage unit code is 4417"
      via: telegram
      expect:
        - reply_contains: ["Saved"]
  checks:
    - memory: ["4417"]
    - recall_top: {query: "storage unit code", contains: ["4417"], k: 3}

- id: ltm-in-intro-answers
  category: ltm_inputs
  severity: medium
  title: A fact from the introduction is found by a question about the person
  world:
    memories:
      - {content: "Shashank is the CEO of Orchard Labs, a logistics company in Bengaluru.", category: about, source: intro_chat}
      - {content: "Shashank does not take calls before 10 am.", category: availability, source: intro_chat}
  turns:
    - say: "hello"
  checks:
    - recall_top: {query: "what company does he run", contains: ["Orchard Labs"], k: 3}
    - recall_top: {query: "what time can I call him", contains: ["before 10"], k: 3}

- id: ltm-in-file-and-link
  category: ltm_inputs
  severity: medium
  title: Facts read from a file and from a link are found, whichever source they came from
  world:
    memories:
      - {content: "Shashank gave a talk on small language models at PyCon India 2025.", category: work, source: document}
      - {content: "Orchard Labs raised a Series A of 4 million dollars in 2024.", category: work, source: link}
  turns:
    - say: "hello"
  checks:
    - recall_top: {query: "what talk did he give", contains: ["PyCon"], k: 3}
    - recall_top: {query: "funding raised", contains: ["Series A"], k: 3}

- id: ltm-in-correction
  category: ltm_inputs
  severity: high
  title: A correction in chat is stored as the new fact
  world:
    learn_model: true
    memories:
      - {content: "Shashank lives in Mumbai.", category: about}
  turns:
    - say: "I no longer live in Mumbai, I moved to Pune last month"
      fake:
        facts: [{content: "Shashank lives in Pune (moved in September 2026).", category: about, replaces: 1}]
  checks:
    - memory: ["Pune"]

# --- ltm_update: the new fact replaces the old, and only the new one is served ---------------
- id: ltm-update-city
  category: ltm_update
  severity: critical
  title: After "I moved to Pune" the old city is no longer served
  world:
    learn_model: true
    memories:
      - {content: "Shashank lives in Mumbai.", category: about}
  turns:
    - say: "I no longer live in Mumbai, I moved to Pune last month"
      fake:
        facts: [{content: "Shashank lives in Pune (moved in September 2026).", category: about, replaces: 1}]
  checks:
    - recall_top: {query: "where does he live or has he moved", contains: ["Pune"], absent: ["Mumbai"], k: 5}

- id: ltm-update-role
  category: ltm_update
  severity: high
  title: A new job title retires the old one
  world:
    learn_model: true
    memories:
      - {content: "Shashank is the head of engineering at Orchard Labs.", category: work}
  turns:
    - say: "update: I'm not head of engineering anymore, I became CTO at Orchard Labs this month"
      fake:
        facts: [{content: "Shashank is the CTO of Orchard Labs (from October 2026).", category: work, replaces: 1}]
  checks:
    - recall_top: {query: "what is his role at Orchard Labs", contains: ["CTO"], absent: ["head of engineering"], k: 5}

- id: ltm-update-said-again-is-one-fact
  category: ltm_update
  severity: medium
  title: Saying a fact twice keeps one note, not two
  world:
    learn_model: true
    memories:
      - {content: "Shashank is allergic to peanuts.", category: preference}
  turns:
    - say: "just so you know, I'm allergic to peanuts, really allergic"
      fake:
        facts: [{content: "Shashank is allergic to peanuts.", category: preference, same_as: 1}]
  checks:
    - recall_top: {query: "peanut allergy", contains: ["peanuts"], k: 5}
    - memory_count: {matching: "peanut", exactly: 1}

- id: ltm-update-old-fact-still-in-history
  category: ltm_update
  severity: medium
  title: A superseded fact is retired, not erased
  world:
    learn_model: true
    memories:
      - {content: "Shashank drives a grey Honda City.", category: about}
  turns:
    - say: "I sold the Honda City, I drive an electric Tata Nexon now"
      fake:
        facts: [{content: "Shashank drives an electric Tata Nexon.", category: about, replaces: 1}]
  checks:
    - memory: ["Nexon"]
    - memory_retired: ["Honda City"]

