  world:
    filler: 38
    memories:
      - {content: "Shashank's passport expires in August 2027.", category: about, age_days: 21}
  turns:
    - say: "hello"
  checks:
    - recall_top: {query: "when does my passport run out", contains: ["August 2027"], k: 3}

