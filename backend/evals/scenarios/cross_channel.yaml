# One Ava across channels: told on Telegram or Slack, known in the app.
- id: xchan-telegram-preference-in-app
  category: cross_channel
  severity: critical
  title: A preference said on Telegram (with a typo) is known in the app chat
  based_on: '"btw i dont like black clour at all!" on Telegram, then "do i like black colour?" in the app (2026-10-21)'
  turns:
    - via: telegram
      say: "btw i dont like black clour at all!"
      expect:
        - honest_about_memory: true
    - via: web
      say: "do i like black colour?"
      expect:
        - reply_contains_any: ["don't like", "do not like", "doesn't like", "not a fan", "dislike", "\\bno\\b", "steer clear", "avoid"]
        - cited: true
        - citations_valid: true

- id: xchan-remember-telegram-ask-slack
  category: cross_channel
  severity: high
  title: Saved on Telegram, asked in a Slack DM
  turns:
    - via: telegram
      say: "remember that the office door code is 7731"
      expect:
        - reply_contains: ["Saved"]
    - via: slack
      say: "what's the office door code?"
      expect:
        - reply_contains: ["7731"]
        - cited: true

- id: xchan-what-did-i-just-say
  category: cross_channel
  severity: high
  title: '"What did I just tell you on Telegram?" in the app'
  turns:
    - via: telegram
      say: "heading to the airport now, flight is at 6, landing in Delhi around 8:30"
    - via: web
      say: "what did I just tell you on Telegram?"
      expect:
        - reply_contains_any: ["airport", "Delhi"]
        - honest_about_memory: true

- id: xchan-reminder-set-on-telegram-listed-in-app
  category: cross_channel
  severity: high
  title: A reminder set on Telegram is listed in the app without doubt
  clock: "15:00"
  turns:
    - via: telegram
      say: "remind me to call mom tomorrow at 7pm"
      expect:
        - reply_contains_any: ["tomorrow.{0,40}7(:00)? ?pm", "\\d{1,2} (Oct|Nov|Dec|Jan)[a-z]*.{0,12}7(:00)? ?pm"]
    - via: web
      say: "what reminders do I have?"
      expect:
        - tool_called: list_reminders
        - reply_contains: ["mom", "7"]
        - reply_not_contains: ["I don't see", "not sure", "may not have", "no reminders"]
  checks:
    - reminder: {text_any: ["mom"], due: {day: 1, at: "19:00"}}

- id: xchan-no-recycled-hedges
  category: cross_channel
  severity: critical
  title: Ava's own outdated Telegram replies are never cited or repeated as facts
  based_on: "live bug 2026-10-22 (445fd98): old hedges cited as [3] [4] [5] and repeated, plus an unprompted 'correction'"
  clock: "12:00"
  world:
    memories:
      - content: "Shashank does not like the colour black."
        category: preference
    messages:
      - via: telegram
        text: "btw i dont like black clour at all!"
      - via: telegram
        from_ava: true
        text: "Noted. I may not keep this beyond this chat, so tell me again if it matters later."
      - via: telegram
        from_ava: true
        text: "I still can't verify identity from messages alone, so keep personal details limited here."
      - via: telegram
        from_ava: true
        text: "You have 2 open reminders: Drink water, today at 1:33 am; Stretch, today at 2:01 am. Both have fired."
  turns:
    - say: "what did I tell you on telegram about colours, and is telegram linked?"
      expect:
        - reply_contains: ["black"]
        - reply_contains_any: ["\\byes\\b", "is linked", "linked"]
        - no_ava_citation: true
        - honest_about_memory: true
        - reply_not_contains: ["verify (who|identity|your identity)", "personal details", "can't confirm", "correct(ion)?\\b.{0,40}(earlier|said|last)", "I said"]
        - judge: "Pass only if Ava says the owner told her they don't like black, says Telegram is linked, and adds no hedges about identity, memory or earlier reminders, and no unprompted corrections of her earlier messages. Saying the preference is saved in the notebook is fine."
