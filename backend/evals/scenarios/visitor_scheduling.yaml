- id: vsched-working-days-are-the-owners-setting
  category: receptionist
  severity: medium
  title: With Monday to Thursday offered, no visitor is offered a Friday, Saturday or Sunday
  world:
    calendar: true
    calendar_settings: {working_days: "Monday to Thursday"}
    triage_model: true
  turns:
    - who: stranger
      via: telegram
      say: "Can we speak on Friday?"
      fake: {reply: "Sure!", schedule: {day: Friday}}
      expect:
        - reply_contains: "Nothing is booked until"
        - reply_not_contains: ["Friday", "Saturday", "Sunday"]
        - bookings_offered: 1
