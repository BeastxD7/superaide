# The flag registry (issue #402). One entry per boolean setting in backend/src/superaide/platform/config.py and
# per *_ENABLED flag. `python3.14 scripts/check_flags.py` (and backend/tests/config/test_flags.py) fail when this
# file and the code disagree, when a stage is missing, when a flag is past its remove-by date, or when the number
# of flags goes above `budget`.
#
# Lifecycle (CONTRIBUTING.md): stage = experiment | beta | stable. A flag that is not `stable` needs a
# `remove_by` no more than 90 days after `added`: by then it is promoted (stage = "stable", no date needed),
# or the flag and the code behind it are deleted. `stable` means a permanent switch with a reason to exist.
#
# `budget` is the most flags allowed. It can only go down: lower it when you delete a flag, never raise it.
# `target` is where the cleanup issues are heading (at most this many owner-facing settings).
#
# The FEATURE FLAGS index in backend/.env.example and docs/flags.md are GENERATED from this file:
#   python3.14 scripts/check_flags.py --write
#
# DRAFT: owner, stage and dates below were filled by a script from the current defaults (default true -> stable,
# default false -> experiment, remove-by 90 days from 2026-11-16). The owner confirms each in review of #402.

