[project]
name = "superaide"
version = "0.1.0"
description = "Superaide: AI personal assistants you hire, who work for you across chat channels"
authors = [
    { name = "Shashank" }
]
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.14.3",  # via pywebpush; floor clears PYSEC-2026-3545/3546/3547
    "alembic>=1.20.0",
    "anthropic>=1.17.0",
    "argon2-cffi>=23",
    "cryptography>=44",
    "dateparser>=1.2",
    "email-validator>=2",
    "fastapi>=0.156.8",
    "fastembed==0.9.0",  # local embeddings on CPU (ONNX, Apache-2.0); exact pin: it downloads models
    "httpcore>=1.0.9",
    "http-ece==1.2.1",  # via pywebpush: RFC 8188/8291 encryption; exact pin
    "httpx>=0.28.1",
    "keyring>=25",
    "openai>=3.36",
    "psycopg[binary]>=3.3.6",
    "py-vapid==1.9.6",  # web push (ADR 0011): exact pin, not the 1.9.5/1.9.6 released 2026-10-14
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pypdf>=5",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "pywebpush==2.5.0",  # web push encryption (aes128gcm) and VAPID; exact pin, web-push-libs
    "pyyaml>=6",
    "slack-bolt>=1.30.0",
    "sqlalchemy>=2.1",
    "trafilatura>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.optional-dependencies]
# The open-source Mem0 baseline for the memory evals (evals/baselines/mem0_baseline.py, #51). Never installed by
# default, never imported by the app, never run in CI: `uv sync --extra eval-mem0` on your own machine.
eval-mem0 = ["mem0ai==2.2.1"]

[project.scripts]
superaide = "superaide:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19",
    "pytest>=9.1.1",
    "pytest-cov>=7",
    "pytest-xdist>=3.8.0",
    "respx>=0.22",
    "ruff>=0.17.1",
    "time-machine>=3.5.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "live: calls the real Claude API and costs money; skipped unless RUN_LIVE=1 and ANTHROPIC_API_KEY is in .env",
]

[tool.coverage.run]
source = ["superaide"]
branch = true

[tool.coverage.report]
skip_empty = true

[tool.mypy]
python_version = "3.14"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/superaide/brain/turn.py" = ["E501"]  # prompt text
"src/superaide/brain/loop.py" = ["E501"]  # prompt text
"src/superaide/docs.py" = ["E501"]  # a Markdown table

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Security", "fastapi.Header", "fastapi.Query", "fastapi.File"]
