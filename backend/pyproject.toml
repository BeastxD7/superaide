[project]
name = "superaide"
version = "0.1.0"
description = "Superaide: AI personal assistants you hire, who work for you across chat channels"
authors = [
    { name = "Shashank" }
]
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.20.0",
    "anthropic>=1.17.0",
    "argon2-cffi>=23",
    "cryptography>=44",
    "email-validator>=2",
    "fastapi>=0.156.8",
    "httpcore>=1.0.9",
    "httpx>=0.28.1",
    "keyring>=25",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pypdf>=5",
    "python-docx>=1.1",
    "python-multipart>=0.0.9",
    "slack-bolt>=1.30.0",
    "sqlalchemy>=2.1",
    "trafilatura>=2",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
superaide = "superaide:main"

[build-system]
requires = ["uv_build>=0.11.32,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=1.19",
    "pytest>=9.1.1",
    "pytest-cov>=7",
    "ruff>=0.17.1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.coverage.run]
source = ["superaide"]
branch = true

[tool.coverage.report]
skip_empty = true

[tool.mypy]
python_version = "3.14"
files = ["src"]
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.ruff]
line-length = 120
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"src/superaide/brain/turn.py" = ["E501"]  # prompt text

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.File"]
