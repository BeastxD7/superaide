# Paste this at https://api.slack.com/apps -> Create New App -> From a manifest.
# Then: Basic Information -> App-Level Tokens -> generate one with connections:write (SLACK_APP_TOKEN),
# and Install App -> copy the Bot User OAuth Token (SLACK_BOT_TOKEN).
display_information:
  name: Ava
  description: An AI content strategist in training. It is an AI, not a person.
features:
  app_home:
    messages_tab_enabled: true
    messages_tab_read_only_enabled: false
  bot_user:
    display_name: Ava
    always_online: true
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - channels:history
      - chat:write
      - groups:history
      - im:history
      - im:read
      - im:write
      - users:read
settings:
  event_subscriptions:
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: true
  token_rotation_enabled: false
