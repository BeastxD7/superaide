# Module map for selective CI (docs/design/test-modules.md). Read by scripts/select_tests.py.
#
# A module is a unit of code (a backend package or a frontend feature group) plus the tests that
# belong to it. When a pull request changes a file, the selector runs the tests of that module and
# of every module that (transitively) imports it, and the e2e specs listed here. Anything that no
# module claims, or that is listed under [full], runs the whole suite.
#
#   src     files the module owns (repo-relative globs; ** crosses directories)
#   tests   the module's own tests: backend pytest files or frontend vitest files. Each test file
#           belongs to exactly ONE module (a test fails if one is unmapped or claimed twice)
#   e2e     Playwright specs that exercise the module; a spec may be listed under several modules
#           (every spec must appear at least once)
#   core    a change here runs the whole suite (shared by nearly everything)
#   always  its tests run with every selection (cross-cutting guards)
#
# A new test file can also declare itself instead of editing this file: first lines "# ci-module: <name>".

[settings]
# transitive: tests of every module that imports the changed code, directly or through others.
# direct: only modules that import it themselves (faster, can miss an indirect break).
expansion = "transitive"

# Paths that never need a test run (documentation and repository chrome).
[ignore]
paths = [
  "**/*.md", "docs/**", ".github/ISSUE_TEMPLATE/**", ".github/CODEOWNERS",
  ".github/pull_request_template.md", ".gitignore", "backend/.dockerignore", "frontend/.dockerignore",
  "share.sh", "start.command", # local launchers; no test or CI step runs them
]

# Paths that run EVERYTHING (shared infrastructure, the build, the contract, this selector).
[full]
paths = [
  "backend/alembic/**", "backend/alembic.ini", "backend/pyproject.toml", "backend/uv.lock",
  "backend/openapi.snapshot.json", "backend/tests/conftest.py", "backend/tests/**/conftest.py",
  "backend/tests/__init__.py", "backend/tests/sharding.py", "backend/tests/fixtures/**",
  "backend/src/superaide/**/models.py", "backend/scripts/**", "backend/Dockerfile",
  ".github/**", "ci/**", "scripts/**", "Makefile",
  "frontend/package.json", "frontend/package-lock.json", "frontend/*.ts", "frontend/*.mjs", "frontend/*.json",
  "frontend/public/**", "frontend/scripts/**", "frontend/Dockerfile",
  "e2e/package.json", "e2e/package-lock.json", "e2e/*.ts", "e2e/*.json", "e2e/src/**", "e2e/fixtures/**", "e2e/scripts/**",
]

[modules.config]
# settings every module reads
core = true
src = [
  "backend/src/superaide/config.py",
  "backend/src/superaide/__init__.py",
]
tests = [
  "backend/tests/test_env_example.py",
]
e2e = []

