# Local development stack.
#
#   docker compose up -d db                # just Postgres 17 + pgvector (what start.command uses)
#   docker compose --profile app up --build   # the whole stack in containers:
#                                            #   app http://localhost:3000, API http://127.0.0.1:8000
#
# Every port is published on 127.0.0.1 only. Secrets come from backend/.env (optional).
name: superaide

x-backend: &backend
  build: ./backend
  image: superaide-api:local
  env_file:
    - path: ./backend/.env
      required: false
  environment:
    # The app's own role (no superuser, no BYPASSRLS), so Row-Level Security applies; the
    # owner runs migrations. `migrate` creates the role (ADR 0009).
    DATABASE_URL: postgresql+psycopg://superaide_app:superaide-app-dev-password@db:5432/agent
    MIGRATION_DATABASE_URL: postgresql+psycopg://agent:agent@db:5432/agent
    APP_DB_PASSWORD: superaide-app-dev-password
    # The API serves; the `worker` service runs jobs and listeners (ignored by the worker itself).
    RUN_JOBS_IN_API: "false"
    RUN_CHANNELS_IN_API: "false"
    FRONTEND_ORIGIN: http://localhost:3000
    # Requests arrive through the web container's /api proxy; trust its client address.
    FORWARDED_ALLOW_IPS: "*"

services:
  db:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: agent
      POSTGRES_DB: agent
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./deploy/postgres/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    <<: *backend
    profiles: [app]
    command: ["sh", "-c", "alembic upgrade head && superaide db-app-role"]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: *backend
    profiles: [app]
    restart: unless-stopped
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      # The vault's master key (encrypts connected credentials) survives rebuilds.
      - vault-key:/home/app/.config/superaide
      # The local embedding model (~220 MB, downloaded once) survives rebuilds.
      - models:/home/app/.cache/superaide
    depends_on:
      migrate:
        condition: service_completed_successfully

  # Jobs and the Telegram/Slack listeners, as on a server (ADR 0009 T11). start.command runs
  # everything in one process instead.
  worker:
    <<: *backend
    profiles: [app]
    restart: unless-stopped
    command: ["superaide", "worker"]
    healthcheck:
      disable: true
    volumes:
      - vault-key:/home/app/.config/superaide
      - models:/home/app/.cache/superaide
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    profiles: [app]
    build: ./frontend
    image: superaide-web:local
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://api:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api

volumes:
  pgdata:
  vault-key:
  models:
